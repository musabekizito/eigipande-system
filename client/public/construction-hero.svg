<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a3d6b"/>
      <stop offset="60%" stop-color="#0a4f8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Sun glow -->
  <circle cx="950" cy="200" r="180" fill="url(#sunGrad)"/>
  <circle cx="950" cy="200" r="80" fill="#facc15" opacity="0.6"/>

  <!-- Distant buildings silhouettes -->
  <g opacity="0.35" fill="#0a2540">
    <rect x="50" y="450" width="80" height="300"/>
    <rect x="140" y="500" width="60" height="250"/>
    <rect x="210" y="380" width="100" height="370"/>
    <rect x="1050" y="430" width="70" height="320"/>
    <rect x="1120" y="470" width="80" height="280"/>
  </g>

  <!-- Mid buildings under construction -->
  <g opacity="0.55" fill="#0a3d6b">
    <rect x="320" y="420" width="140" height="330"/>
    <rect x="480" y="350" width="160" height="400"/>
    <rect x="660" y="470" width="120" height="280"/>
    <rect x="800" y="390" width="140" height="360"/>
  </g>

  <!-- Building with grid windows -->
  <g opacity="0.7">
    <rect x="480" y="350" width="160" height="400" fill="#0a4f8a"/>
    <g fill="#facc15" opacity="0.35">
      <rect x="495" y="370" width="20" height="15"/>
      <rect x="525" y="370" width="20" height="15"/>
      <rect x="555" y="370" width="20" height="15"/>
      <rect x="585" y="370" width="20" height="15"/>
      <rect x="495" y="400" width="20" height="15"/>
      <rect x="525" y="400" width="20" height="15"/>
      <rect x="555" y="400" width="20" height="15"/>
      <rect x="585" y="400" width="20" height="15"/>
      <rect x="495" y="430" width="20" height="15"/>
      <rect x="525" y="430" width="20" height="15"/>
      <rect x="555" y="430" width="20" height="15"/>
      <rect x="585" y="430" width="20" height="15"/>
    </g>
  </g>

  <!-- Cranes -->
  <g stroke="#facc15" stroke-width="4" fill="none" opacity="0.85">
    <!-- Crane 1 -->
    <line x1="380" y1="200" x2="380" y2="450"/>
    <line x1="280" y1="200" x2="500" y2="200"/>
    <line x1="380" y1="200" x2="280" y2="200"/>
    <line x1="380" y1="200" x2="500" y2="200"/>
    <line x1="490" y1="200" x2="490" y2="280"/>
    <rect x="485" y="280" width="10" height="8" fill="#facc15"/>
    <!-- Diagonals -->
    <line x1="380" y1="200" x2="330" y2="170" stroke-width="2"/>
    <line x1="380" y1="200" x2="430" y2="170" stroke-width="2"/>

    <!-- Crane 2 (background) -->
    <line x1="720" y1="280" x2="720" y2="470" stroke-width="3" opacity="0.6"/>
    <line x1="650" y1="280" x2="800" y2="280" stroke-width="3" opacity="0.6"/>
    <line x1="790" y1="280" x2="790" y2="340" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Scaffolding pattern -->
  <g stroke="#facc15" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="320" y1="420" x2="460" y2="420"/>
    <line x1="320" y1="450" x2="460" y2="450"/>
    <line x1="320" y1="480" x2="460" y2="480"/>
    <line x1="320" y1="510" x2="460" y2="510"/>
    <line x1="350" y1="420" x2="350" y2="750"/>
    <line x1="390" y1="420" x2="390" y2="750"/>
    <line x1="430" y1="420" x2="430" y2="750"/>
  </g>

  <!-- Ground / Construction site -->
  <rect x="0" y="740" width="1200" height="60" fill="#0a2540"/>

  <!-- Foreground silhouettes: hard hat worker -->
  <g transform="translate(150, 620) scale(1.2)" fill="#0a2540">
    <!-- Body -->
    <rect x="-15" y="40" width="50" height="80" rx="6"/>
    <!-- Head -->
    <circle cx="10" cy="25" r="20"/>
    <!-- Hard hat -->
    <path d="M-12 22 Q10 -5 32 22 Z"/>
    <!-- Arms -->
    <rect x="-30" y="50" width="20" height="10" rx="3"/>
    <rect x="30" y="50" width="20" height="10" rx="3"/>
  </g>

  <!-- Foreground silhouettes: worker with clipboard -->
  <g transform="translate(1000, 620) scale(1.2)" fill="#0a2540">
    <rect x="-15" y="40" width="50" height="80" rx="6"/>
    <circle cx="10" cy="25" r="20"/>
    <path d="M-12 22 Q10 -5 32 22 Z"/>
    <rect x="-30" y="50" width="20" height="10" rx="3"/>
    <rect x="30" y="50" width="20" height="10" rx="3"/>
    <rect x="-5" y="60" width="30" height="20" fill="#facc15" opacity="0.4" rx="2"/>
  </g>

  <!-- Safety stripes at bottom -->
  <g opacity="0.6">
    <rect x="0" y="780" width="1200" height="20" fill="#0a3d6b"/>
    <g fill="#facc15">
      <polygon points="0,780 20,800 40,780 60,800 80,780 100,800 120,780 140,800 160,780 180,800 200,780 220,800 240,780 260,800 280,780 300,800 320,780 340,800 360,780 380,800 400,780 420,800 440,780 460,800 480,780 500,800 520,780 540,800 560,780 580,800 600,780 620,800 640,780 660,800 680,780 700,800 720,780 740,800 760,780 780,800 800,780 820,800 840,780 860,800 880,780 900,800 920,780 940,800 960,780 980,800 1000,780 1020,800 1040,780 1060,800 1080,780 1100,800 1120,780 1140,800 1160,780 1180,800 1200,780"/>
    </g>
  </g>
</svg>